# hiyuki-agent — repository metadata and developer tooling.
#
# IMPORTANT: the Hermes runtime is a SEPARATE pinned git dependency, not a
# dependency of this pyproject. It is installed from its own checkout:
#
#     git clone --branch <pinned ~0.21.0> https://github.com/NousResearch/hermes-agent.git
#     uv venv           (OUTSIDE the hermes source tree)
#     uv pip install -e ".[messaging,mcp]"
#
# Extras: messaging -> discord.py 2.7.1, mcp -> mcp 2.0.0.
# The exact upstream commit SHA is pinned during deployment phase F6.
#
# This pyproject therefore carries ONLY repo metadata plus ruff/mypy/pytest
# configuration. It is not itself pip-installed as a package.

[project]
name = "hiyuki-agent"
version = "0.1.0"
description = "Hiyuki — a single-agent, zero-restriction deployment of NousResearch/hermes-agent for a single operator, over Discord."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "BSD-3-Clause"
authors = [
    { name = "Faizul Fadhly" },
]
keywords = ["agent", "hermes-agent", "discord", "llm", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
]

# The local plugin at plugins/memory-providers/enowx-rag is wired into the
# Hermes runtime env as an editable package during installation (phase F6/F7),
# not as a dependency of this top-level project. This keeps Hermes' own
# dependency resolution authoritative while the plugin remains versioned here.

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".runtime", ".hermes", ".hermes-agent"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_no_return = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
namespace_packages = true
exclude = [".runtime", ".hermes", ".hermes-agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
python_files = ["test_*.py", "*_test.py"]